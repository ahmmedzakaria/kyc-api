spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=false
nexacore.flyway.baseline-on-migrate=true
nexacore.flyway.validate-on-migrate=true

firebase.auth.enabled=false
storage.type=filesystem
storage.filesystem.base-dir=${java.io.tmpdir}/nexacore-test-uploads
storage.filesystem.public-base-url=/uploads

messaging.mobile.enabled=false
messaging.email.enabled=false

logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate.SQL=ERROR
