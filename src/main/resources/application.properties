# ==============================
# Server
# ==============================
server.port=9100

# ==============================
# Application Identity
# ==============================
app.name=${APP_NAME:NexaCore}
app.slug=${APP_SLUG:nexacore}

# ==============================
# Spring Datasource (PostgreSQL)server.port=9100
# ==============================

#spring.datasource.url=jdbc:postgresql://localhost:5432/kyc_db
#spring.datasource.username=postgres
#spring.datasource.password=123456
#spring.datasource.driver-class-name=org.postgresql.Driver


# Flyway owns schema changes; Hibernate validates mappings without recreating
# enum-derived CHECK constraints removed by system migration V9.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===============================
# Flyway Database Migrations
# ===============================
# Disabled here because this project uses multiple manually configured datasources.
# FlywayMigrationConfig runs migrations separately for auth, system, kyc, gis, and log databases.
spring.flyway.enabled=false
nexacore.flyway.baseline-on-migrate=${NEXACORE_FLYWAY_BASELINE_ON_MIGRATE:true}
nexacore.flyway.validate-on-migrate=${NEXACORE_FLYWAY_VALIDATE_ON_MIGRATE:true}



# ===============================
# AUTH_DB DATABASE (PostgreSQL)
# ===============================
spring.datasource.auth.jdbc-url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.auth.username=postgres
spring.datasource.auth.password=123456
spring.datasource.auth.driver-class-name=org.postgresql.Driver

# ===============================
# SYSTEM_DB DATABASE (PostgreSQL)
# ===============================
spring.datasource.system.jdbc-url=jdbc:postgresql://localhost:5433/system_db
spring.datasource.system.username=postgres
spring.datasource.system.password=123456
spring.datasource.system.driver-class-name=org.postgresql.Driver


# ===============================
# KYC_DB DATABASE (PostgreSQL)
# ===============================
spring.datasource.kyc.jdbc-url=jdbc:postgresql://localhost:5433/kyc_db
spring.datasource.kyc.username=postgres
spring.datasource.kyc.password=123456
spring.datasource.kyc.driver-class-name=org.postgresql.Driver



# ===============================
# GIS_DB DATABASE (PostgreSQL)
# ===============================
spring.datasource.gis.jdbc-url=jdbc:postgresql://localhost:5433/gisdb
spring.datasource.gis.username=postgres
spring.datasource.gis.password=123456
spring.datasource.gis.driver-class-name=org.postgresql.Driver


# ===============================
# LOG_DB DATABASE (PostgreSQL)
# ===============================
spring.datasource.log.jdbc-url=jdbc:postgresql://localhost:5433/log_db
spring.datasource.log.username=postgres
spring.datasource.log.password=123456
spring.datasource.log.driver-class-name=org.postgresql.Driver

# ===============================
# LOG CLEANUP
# ===============================
log.cleanup.enabled=${LOG_CLEANUP_ENABLED:true}
log.cleanup.retention-days=${LOG_CLEANUP_RETENTION_DAYS:90}
log.cleanup.cron=${LOG_CLEANUP_CRON:0 0 2 * * *}


# ==============================
# JWT Settings (Optional)
# ==============================

jwt.secret=${JWT_SECRET:492421df8dddfa71049356c47fc28d10f711c9171bde93e2552c5a2f637d7e53}
jwt.issuer=${JWT_ISSUER:nexacore}
jwt.audience=${JWT_AUDIENCE:nexacore-api}
jwt.expiration=${JWT_EXPIRATION_MS:1500000}
#jwt.expiration=300000
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS:9900000}
jwt.allowed-clock-skew-seconds=${JWT_ALLOWED_CLOCK_SKEW_SECONDS:60}
#This means: If your server clock and the token issuer’s clock are slightly out of sync, valid tokens might get rejected. This setting prevents that
#A token that expired up to 60 seconds ago is still accepted
#A token that starts in up to 60 seconds in the future is still accepted

# ==============================
# Authentication Policy / Keycloak
# ==============================
# DB-backed client policy is the source of truth.
# These values are fallback defaults when no enabled DB policy rows exist for a client.
app.auth.login-methods=${AUTH_LOGIN_METHODS:PASSWORD}
app.auth.login-identifiers=${AUTH_LOGIN_IDENTIFIERS:USERNAME}
app.auth.session-timeout-seconds=${AUTH_SESSION_TIMEOUT_SECONDS:3600}
app.auth.refresh-token-enabled=${AUTH_REFRESH_TOKEN_ENABLED:true}
app.auth.max-login-attempts=${AUTH_MAX_LOGIN_ATTEMPTS:5}
app.auth.password-policy-code=${AUTH_PASSWORD_POLICY_CODE:DEFAULT}
app.registration.mode=${REGISTRATION_MODE:APPROVAL_REQUIRED}
app.registration.activation-mode=${USER_ACTIVATION_MODE:APPROVAL_REQUIRED}
app.registration.requires-existing-person=${REGISTRATION_REQUIRES_EXISTING_PERSON:true}

# Optional property-level client overrides. DB rows still take priority.
# For public auth/config APIs, send X-Client-Code. Without X-Client-Code, the backend derives the client from Origin.
# app.auth.clients[nexacore-client].login-methods=PASSWORD
# app.auth.clients[nexacore-client].login-identifiers=USERNAME
# app.auth.clients[privilege-frontend].login-methods=SSO
# app.auth.clients[privilege-frontend].login-identifiers=USERNAME
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9200/realms/kyc}
keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:9200/realms/kyc/protocol/openid-connect/certs}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:nexacore-client}
keycloak.allowed-client-ids=${KEYCLOAK_ALLOWED_CLIENT_IDS:nexacore-client,privilege-frontend}
keycloak.required-audience=${KEYCLOAK_AUDIENCE:nexacore}
keycloak.sync-user=${KEYCLOAK_SYNC_USER:true}
keycloak.default-role=${KEYCLOAK_DEFAULT_ROLE:ROLE_KYC_OPERATOR}

# ==============================
# CORS Settings (Optional)
# ==============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:5300,http://localhost:3000}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Silent,X-Client-Code,X-API-Key,X-Trace-Id}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Trace-Id}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

# Forwarded client addresses are trusted only when the direct peer matches one of these CIDRs.
access-control.trusted-proxy-cidrs=${ACCESS_CONTROL_TRUSTED_PROXY_CIDRS:}
access-control.rate-limit-enabled=${ACCESS_CONTROL_RATE_LIMIT_ENABLED:true}
access-control.rate-limit-fail-open=${ACCESS_CONTROL_RATE_LIMIT_FAIL_OPEN:false}

logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

# ==============================
# Observability / OpenTelemetry
# ==============================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.tracing.enabled=${OTEL_TRACING_ENABLED:false}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_PROBABILITY:0.10}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.metrics.tags.application=${app.slug}
management.metrics.tags.service=${app.name}

# ==============================
# Internationalization / i18n
# ==============================
i18n.default-locale=${I18N_DEFAULT_LOCALE:en}
i18n.supported-locales=${I18N_SUPPORTED_LOCALES:en,bn}
i18n.basename=${I18N_BASENAME:classpath:i18n/messages,classpath:i18n/validation}
i18n.encoding=${I18N_ENCODING:UTF-8}
i18n.fallback-to-system-locale=${I18N_FALLBACK_TO_SYSTEM_LOCALE:false}
i18n.language-parameter=${I18N_LANGUAGE_PARAMETER:lang}

# ==============================
# File Storage Configuration
# ==============================
#storage.type=${STORAGE_TYPE:fileSystem}
storage.type=${STORAGE_TYPE:minio}
storage.filesystem.base-dir=${UPLOAD_DIR:./uploads}
storage.filesystem.public-base-url=${STORAGE_FILESYSTEM_PUBLIC_BASE_URL:/uploads}
storage.minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
storage.minio.public-base-url=${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.minio.bucket=${MINIO_BUCKET:kyc-files}
storage.minio.auto-create-bucket=${MINIO_AUTO_CREATE_BUCKET:true}

# ==============================
# Cache Configuration
# ==============================
cache.type=${CACHE_TYPE:redis}
cache.redis.key-prefix=${CACHE_REDIS_KEY_PREFIX:nexacore}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# ==============================
# Queueing Service / RabbitMQ
# ==============================
queueing.service.enabled=${QUEUEING_SERVICE_ENABLED:false}
queueing.service.provider-name=${QUEUEING_SERVICE_PROVIDER:rabbitmq}
queueing.service.auto-declare=${QUEUEING_SERVICE_AUTO_DECLARE:false}
queueing.service.durable-queue=${QUEUEING_SERVICE_DURABLE_QUEUE:true}
queueing.service.default-exchange=${QUEUEING_SERVICE_DEFAULT_EXCHANGE:}
queueing.service.default-queue=${QUEUEING_SERVICE_DEFAULT_QUEUE:nexacore.default}
queueing.service.default-routing-key=${QUEUEING_SERVICE_DEFAULT_ROUTING_KEY:nexacore.default}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

# ==============================
# Mobile Messaging / SMS
# ==============================
messaging.mobile.enabled=${MOBILE_MESSAGING_ENABLED:false}
messaging.mobile.provider-name=${MOBILE_MESSAGING_PROVIDER:generic}
messaging.mobile.gateway-url=${MOBILE_MESSAGING_GATEWAY_URL:}
messaging.mobile.api-key=${MOBILE_MESSAGING_API_KEY:}
messaging.mobile.auth-header-name=${MOBILE_MESSAGING_AUTH_HEADER_NAME:Authorization}
messaging.mobile.auth-header-prefix=${MOBILE_MESSAGING_AUTH_HEADER_PREFIX:Bearer}
messaging.mobile.sender-id=${MOBILE_MESSAGING_SENDER_ID:${app.name}}
messaging.mobile.timeout-seconds=${MOBILE_MESSAGING_TIMEOUT_SECONDS:10}
messaging.mobile.otp-template=${MOBILE_MESSAGING_OTP_TEMPLATE:Your ${app.name} OTP is %s. It will expire in %d minutes.}

# ==============================
# Email Messaging / SMTP
# ==============================
messaging.email.enabled=${EMAIL_MESSAGING_ENABLED:false}
messaging.email.provider-name=${EMAIL_MESSAGING_PROVIDER:smtp}
messaging.email.from-address=${EMAIL_FROM_ADDRESS:no-reply@${app.slug}.local}
messaging.email.from-name=${EMAIL_FROM_NAME:${app.name}}
messaging.email.otp-subject=${EMAIL_OTP_SUBJECT:Your ${app.name} OTP}
messaging.email.otp-template=${EMAIL_OTP_TEMPLATE:Your ${app.name} OTP is %s. It will expire in %d minutes.}
messaging.email.transaction-subject=${EMAIL_TRANSACTION_SUBJECT:${app.name} Transaction Update}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}

# ==============================
# Report Rendering / JasperReports
# ==============================
report.service.provider-name=${REPORT_SERVICE_PROVIDER:jasper}
report.service.templates-base-path=${REPORT_SERVICE_TEMPLATES_BASE_PATH:reports/templates}
report.service.default-file-name=${REPORT_SERVICE_DEFAULT_FILE_NAME:report}

# ==============================
# Workflow Engine
# ==============================
nexacore.workflow.engine=${NEXACORE_WORKFLOW_ENGINE:local}

# ==============================
# API Access Control
# ==============================
access-control.enabled=${ACCESS_CONTROL_ENABLED:true}
access-control.enforcement-mode=${ACCESS_CONTROL_ENFORCEMENT_MODE:REPORT}
access-control.require-client-for-browser=${ACCESS_CONTROL_REQUIRE_CLIENT_FOR_BROWSER:false}
access-control.require-client-for-confidential=${ACCESS_CONTROL_REQUIRE_CLIENT_FOR_CONFIDENTIAL:true}
access-control.registry-coverage-enabled=${ACCESS_CONTROL_REGISTRY_COVERAGE_ENABLED:true}

# ==============================
# Firebase Authentication / Phone Verification
# ==============================
firebase.auth.enabled=${FIREBASE_AUTH_ENABLED:true}
firebase.auth.project-id=${FIREBASE_PROJECT_ID:kyc-a8e6d}
firebase.auth.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:backend/src/main/java/com/nexacore/servicesmodule/firebaseauthservice/firebase-service-account.json}
firebase.auth.use-application-default-credentials=${FIREBASE_USE_APPLICATION_DEFAULT_CREDENTIALS:false}
firebase.auth.phone-sign-in-provider=${FIREBASE_PHONE_SIGN_IN_PROVIDER:phone}

# ==============================
# Swagger / OpenAPI
# ==============================
app.swaggerUrl=:9100/pilot/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# Multipart Enable
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
